envVarGroups:
  - name: daily-digest-backend-config
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MARKET_WATCHLIST
        value: AAPL,MSFT,NVDA,GOOGL,AMZN
      - key: MARKET_EXCHANGE
        value: US
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_REASONING_EFFORT
        value: minimal
      - key: OPENAI_VERBOSITY
        value: low

services:
  - type: web
    name: daily-digest-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: daily-digest-backend-config
      - key: DATABASE_URL
        fromDatabase:
          name: daily-digest-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          name: daily-digest-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FINNHUB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: daily-digest-worker
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: python -m app.workers.main
    envVars:
      - fromGroup: daily-digest-backend-config
      - key: DATABASE_URL
        fromDatabase:
          name: daily-digest-db
          property: connectionString
      - key: FINNHUB_API_KEY
        fromService:
          name: daily-digest-api
          type: web
          envVarKey: FINNHUB_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          name: daily-digest-api
          type: web
          envVarKey: OPENAI_API_KEY

  - type: web
    name: daily-digest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: VITE_API_BASE_URL
        fromService:
          name: daily-digest-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: daily-digest-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    databaseName: daily_digest
    user: daily_digest
    ipAllowList: []
