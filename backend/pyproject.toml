[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-digest-backend"
version = "0.1.0"
description = "FastAPI backend for Daily Digest"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "feedparser>=6.0.12,<7",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
